[package]
name = "flux-platform"
version = "0.1.0"
edition = "2024"

[dependencies]
flux-api = { path = "../flux-api" }
async-channel = "2"
log = "0.4"
ashpd = { version = "0.14.0", features = ["global_shortcuts", "file_chooser"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
oo7 = "0.7.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
futures-util = "0.3.34"

[dev-dependencies]
tempfile = "3.27.0"
