[package]
name = "flux-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
flux-api = { path = "../flux-api" }
toml = "1.2.1"
flux-core = { path = "../flux-core" }
flux-platform = { path = "../flux-platform" }
flux-runtime = { path = "../flux-runtime" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
