[package]
name = "flux-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
flux-api = { path = "../flux-api" }
mlua = { version = "0.12", features = ["lua54", "vendored", "async", "serialize"] }
tokio = { version = "1", features = ["rt", "process", "time", "sync", "io-util", "macros"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
libc = "0.2"
url = "2"
toml = "1.2.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
landlock = "0.4.7"
seccompiler = "0.5.0"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
